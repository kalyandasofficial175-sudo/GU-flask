<!DOCTYPE html>
<html>
<head>
    <title>Records</title>
    <!-- Bootstrap 3.4.1 CSS -->
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/css/bootstrap.min.css">
    <!-- jQuery and Bootstrap JS -->
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/js/bootstrap.min.js"></script>
    
    <style>
        .profile-img {
            width: 40px; 
            height: 40px; 
            object-fit: cover; 
            border-radius: 50%;
        }
        .page-header { margin-top: 20px; }
    </style>
</head>
<body> 
    <div class="container">
        <div class="page-header">
            <h1>Database Records <small></small></h1>
        </div>

        <div class="table-responsive">
           
            <table class="table table-striped table-hover table-bordered">
                <thead class="bg-primary">
                    <tr>
                        <th>Name</th>
                        <th>Email</th>
                        <th>Age</th>
                        <th>Gender</th>
                        <th>Religion</th>
                        <th>Birthdate</th>
                        <th class="text-center">Photo</th>
                    </tr>
                </thead>
                <tbody>
                    {% for user in users %}
                    <tr>
                        <td style="vertical-align: middle;">{{ user.name }}</td>
                        <td style="vertical-align: middle;">{{ user.email }}</td>
                        <td style="vertical-align: middle;">{{ user.age }}</td>
                        <td style="vertical-align: middle;">{{ user.gender }}</td>
                        <td style="vertical-align: middle;">{{ user.religion }}</td>
                        <td style="vertical-align: middle;">{{ user.birthdate }}</td>
                        <td class="text-center">
                            <img src="{{ url_for('static', filename='uploads/' + user.profile_pic) }}" 
                                 class="img-thumbnail profile-img" 
                                 alt="User Photo">
                        </td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>

        <hr>
        <a href="{{ url_for('form_view') }}" class="btn btn-success">
            <span class="glyphicon glyphicon-plus"></span> Add New Record
        </a>
    </div>
</body>
</html>
